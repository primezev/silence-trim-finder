name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: powershell
        run: |
          Get-ChildItem -Path . -Recurse -File

      - name: Extract project
        shell: powershell
        run: |
          $zip = Get-ChildItem -Path . -Recurse -Filter "*.zip" -File | Select-Object -First 1
          if (-not $zip) {
            Write-Error "ZIP file not found"
            exit 1
          }
          Write-Host "Found ZIP: $($zip.FullName)"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath project -Force

      - name: Find source
        shell: powershell
        run: |
          Get-ChildItem project -Recurse -File

      - name: Install MinGW
        run: choco install mingw -y

      - name: Build
        shell: powershell
        run: |
          $source = Get-ChildItem project -Recurse -Filter "silence_finder_cli.c" -File | Select-Object -First 1

          if (-not $source) {
            Write-Error "silence_finder_cli.c not found"
            exit 1
          }

          Write-Host "Found source: $($source.FullName)"

          gcc $source.FullName -O2 -o silence_finder.exe -lm

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Silence-Trim-Finder-Windows
          path: silence_finder.exe
